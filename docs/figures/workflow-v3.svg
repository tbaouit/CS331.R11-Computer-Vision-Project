<title id="title">V3 · Khôi phục có hướng dẫn và phản hồi</title>
<desc id="desc">Ba nguồn hướng dẫn đưa vào SD 1.5, Qwen chấm từng ứng viên, phản hồi trở về bước tinh chỉnh.</desc>
