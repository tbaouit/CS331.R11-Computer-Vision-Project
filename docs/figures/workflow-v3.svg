<text x="1092" y="558" fill="#405965" font-size="17" font-weight="400" >chỉ chứa phần V.</text>
<text x="954" y="601" fill="#405965" font-size="18" font-weight="400" >CLIP ViT-H mã hóa đặc trưng bề mặt.</text>
<rect x="954" y="619" width="338" height="34" rx="6" fill="#f2eff8" stroke="none"/>
<text x="968" y="642" fill="#574488" font-size="17" font-weight="650" >Đầu ra   ·   Đặc trưng ảnh, scale 0,5</text>
<path d="M237 668 V695 H1123 V668 M680 668 V695" fill="none" stroke="#086d6a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M680 695 V717" fill="none" stroke="#086d6a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="44" y="727" width="1272" height="180" rx="14" fill="#fff" stroke="#cbd9d9"/>
<text x="68" y="761" fill="#086d6a" font-size="16" font-weight="700" >04    /    TINH CHỈNH ẢNH</text>
<text x="68" y="806" fill="#162e39" font-size="31" font-weight="670" >SD 1.5 + DDIM</text>
<text x="68" y="844" fill="#526a75" font-size="20" font-weight="400" >ROI vuông 512 × 512</text>
<path d="M384 749 V886" fill="none" stroke="#cbd9d9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="410" y="773" fill="#405965" font-size="19" font-weight="400" >Nhận prompt, ảnh khởi tạo, đặc trưng ảnh và mask inpaint.</text>
<text x="410" y="804" fill="#405965" font-size="19" font-weight="400" >Mỗi bước DDIM giữ latent sinh trong vùng cho phép sửa và khôi phục latent</text>
<text x="410" y="835" fill="#405965" font-size="19" font-weight="400" >tham chiếu bên ngoài theo mức nhiễu của bước đó. Sau khi giải mã, khóa màu</text>
<text x="410" y="866" fill="#405965" font-size="19" font-weight="400" >theo prior, hòa biên, chép lại V và gắn alpha từ A để tạo ứng viên RGBA.</text>
<path d="M680 907 V941" fill="none" stroke="#086d6a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="44" y="951" width="1272" height="181" rx="14" fill="#fff" stroke="#cbd9d9"/>
<text x="68" y="987" fill="#93520c" font-size="16" font-weight="700" >05    /    ĐÁNH GIÁ ỨNG VIÊN</text>
<text x="68" y="1032" fill="#162e39" font-size="30" font-weight="670" >Qwen3-VL critic</text>
<text x="68" y="1070" fill="#526a75" font-size="19" font-weight="400" >Tập trung vào H và đường nối.</text>
<path d="M384 973 V1110" fill="none" stroke="#cbd9d9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="410" y="994" fill="#405965" font-size="19" font-weight="400" >Đọc bốn ảnh cùng tọa độ: cảnh gốc, phần V, ứng viên và bản đồ V/H.</text>
<text x="410" y="1026" fill="#405965" font-size="19" font-weight="400" >Chấm độ khớp màu và tính liên tục của cấu trúc, mỗi tiêu chí từ 0 đến 10.</text>
<text x="410" y="1058" fill="#405965" font-size="19" font-weight="400" >Đạt khi Qwen trả PASS và cả hai điểm đều từ 7 trở lên.</text>
<text x="410" y="1103" fill="#93520c" font-size="18" font-weight="650" >Nếu bị từ chối và còn lượt: bổ sung chỉ dẫn sửa, đổi seed, tăng guidance.</text>
<path d="M1316 1098 H1340 V818 H1321" fill="none" stroke="#93520c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retry)"/>
<path d="M680 1132 V1160" fill="none" stroke="#086d6a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
