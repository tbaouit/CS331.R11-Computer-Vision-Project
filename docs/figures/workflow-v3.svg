<text x="242" y="1216" fill="#086d6a" font-size="25" font-weight="670" >06    /    Chọn ảnh RGBA cuối cùng</text>
<text x="242" y="1250" fill="#405965" font-size="18" font-weight="400" >Dừng ở ứng viên đầu tiên đạt yêu cầu. Nếu cả 3 lượt đều bị từ chối, chọn ứng viên có điểm tốt nhất.</text>
<text x="242" y="1278" fill="#405965" font-size="18" font-weight="400" >Lưu ảnh đã chọn cùng điểm, lý do và số lượt thử để phân tích lỗi.</text>
<path d="M44 1333 H1316" fill="none" stroke="#cbd9d9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="44" y="1364" fill="#526a75" font-size="18" font-weight="400" >Các nhánh 01–03 biểu diễn ba nguồn hướng dẫn cho bước 04. Đường màu cam là vòng thử lại, tối đa 3 lượt sinh tổng cộng.</text>
