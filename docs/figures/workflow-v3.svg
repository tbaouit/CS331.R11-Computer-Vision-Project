<text x="44" y="95" fill="#fff" font-size="44" font-weight="680" >Khôi phục có hướng dẫn và phản hồi</text>
<text x="45" y="135" fill="#deeeea" font-size="21" font-weight="400" >Mô tả bề mặt, ảnh hoàn chỉnh sơ bộ và vùng nhìn thấy cùng hướng dẫn SD 1.5.</text>
<text x="1308" y="59" fill="#9bdbcb" font-size="34" font-weight="700" text-anchor="end">V3</text>
<text x="44" y="210" fill="#162e39" font-size="25" font-weight="700" >Dữ liệu cho một vật thể</text>
<text x="1316" y="209" fill="#526a75" font-size="18" font-weight="400" text-anchor="end">Ví dụ minh họa bằng một chiếc bình</text>
