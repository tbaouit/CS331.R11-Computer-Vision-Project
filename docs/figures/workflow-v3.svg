<text x="68" y="436" fill="#574488" font-size="16" font-weight="700" >01    /    HƯỚNG DẪN BẰNG CHỮ</text>
<text x="68" y="476" fill="#162e39" font-size="27" font-weight="670" >Qwen3-VL + CLIP</text>
<text x="68" y="515" fill="#405965" font-size="18" font-weight="400" >Qwen đọc cảnh và phần V đã tách,</text>
<text x="68" y="543" fill="#405965" font-size="18" font-weight="400" >mô tả loại vật, màu, chất liệu, họa tiết.</text>
<text x="68" y="571" fill="#405965" font-size="18" font-weight="400" >CLIP đối chiếu mô tả với ảnh phần V</text>
<text x="68" y="599" fill="#405965" font-size="18" font-weight="400" >để chọn prompt cho SD 1.5.</text>
<rect x="68" y="619" width="338" height="34" rx="6" fill="#f2eff8" stroke="none"/>
<text x="82" y="642" fill="#574488" font-size="17" font-weight="650" >Đầu ra   ·   Prompt mô tả bề mặt</text>
<text x="511" y="436" fill="#086d6a" font-size="16" font-weight="700" >02    /    KHỞI TẠO VÙNG KHUẤT</text>
<text x="511" y="476" fill="#162e39" font-size="27" font-weight="670" >Pix2Gestalt + CarveKit</text>
<text x="511" y="515" fill="#405965" font-size="18" font-weight="400" >Pix2Gestalt sinh ảnh RGB sơ bộ.</text>
<text x="511" y="543" fill="#405965" font-size="18" font-weight="400" >CarveKit tách vật thể khỏi nền.</text>
<text x="511" y="571" fill="#405965" font-size="18" font-weight="400" >Căn màu theo V, bù chỗ thiếu rồi</text>
<text x="511" y="599" fill="#405965" font-size="18" font-weight="400" >đưa RGB sơ bộ vào vùng H.</text>
<rect x="511" y="619" width="338" height="34" rx="6" fill="#e6f3ef" stroke="none"/>
<text x="525" y="642" fill="#086d6a" font-size="17" font-weight="650" >Đầu ra   ·   Ảnh khởi tạo và vùng thiếu</text>
<text x="954" y="436" fill="#574488" font-size="16" font-weight="700" >03    /    HƯỚNG DẪN BẰNG ẢNH</text>
<text x="954" y="476" fill="#162e39" font-size="27" font-weight="670" >IP-Adapter Plus</text>
