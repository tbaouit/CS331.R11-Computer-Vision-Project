<text x="954" y="704" fill="#405965" font-size="19" font-weight="400" >Hòa biên rồi chép lại pixel gốc ở V.</text>
<text x="954" y="733" fill="#405965" font-size="19" font-weight="400" >Kênh alpha lấy từ mask A,</text>
<text x="954" y="762" fill="#405965" font-size="19" font-weight="400" >nền ngoài vật thể trong suốt.</text>
<path d="M44 839 H1316" fill="none" stroke="#cbd9d9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="44" y="870" fill="#526a75" font-size="18" font-weight="400" >Hình minh họa mô tả luồng xử lý. Màu và họa tiết bên trong H là một khả năng do mô hình sinh ra.</text>
