<text x="68" y="675" fill="#405965" font-size="19" font-weight="400" >Chép RGB gốc vào V, tô xám H</text>
<text x="68" y="704" fill="#405965" font-size="19" font-weight="400" >và đặt nền trắng ngoài vật thể.</text>
<text x="68" y="733" fill="#405965" font-size="19" font-weight="400" >Cắt ô vuông quanh A, mở rộng</text>
<text x="68" y="762" fill="#405965" font-size="19" font-weight="400" >mask inpaint 2 px quanh H.</text>
<text x="511" y="445" fill="#574488" font-size="16" font-weight="700" >02    /    TẠO SINH</text>
<text x="511" y="488" fill="#162e39" font-size="28" font-weight="670" >SD 1.5 Inpainting</text>
