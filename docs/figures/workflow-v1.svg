<text x="528" y="547" fill="#574488" font-size="19" font-weight="650" >Prompt chung cho mọi vật thể</text>
<text x="528" y="578" fill="#574488" font-size="18" font-weight="400" >“natural colors, realistic texture”</text>
<text x="511" y="650" fill="#405965" font-size="19" font-weight="400" >Thu ảnh và mask về 512 × 512.</text>
<text x="511" y="679" fill="#405965" font-size="19" font-weight="400" >Khử nhiễu với bộ lấy mẫu DDIM.</text>
<text x="511" y="708" fill="#405965" font-size="19" font-weight="400" >28 bước · guidance 7 · strength 1.</text>
<text x="511" y="737" fill="#405965" font-size="19" font-weight="400" >Đưa ảnh sinh về tọa độ ban đầu.</text>
<text x="954" y="445" fill="#086d6a" font-size="16" font-weight="700" >03    /    GHÉP ẢNH</text>
<text x="954" y="488" fill="#162e39" font-size="28" font-weight="670" >Xuất vật thể RGBA</text>
